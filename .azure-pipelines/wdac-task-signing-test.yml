trigger: none
pr: none

pool:
  name: WDAC-Test-Pool

variables:
  system.debug: true
  testRoot: '$(Build.ArtifactStagingDirectory)\wdac-task-signing'

steps:
- checkout: none

# 1. PowerShell3 handler and PowerShell module loading.
- task: PowerShell@2
  displayName: '1. PowerShell V2 - prepare test data'
  inputs:
    targetType: inline
    script: |
      $root = '$(testRoot)'

      New-Item "$root\input" -ItemType Directory -Force | Out-Null
      Set-Content "$root\input\hello.txt" 'WDAC task-signing test'
      Set-Content "$root\input\settings.json" '{"environment":"before"}'

      Write-Host "Created test data under $root"

# 2. Node handler performing file-system operations.
- task: CopyFiles@2
  displayName: '2. CopyFiles V2 - Node file operations'
  inputs:
    SourceFolder: '$(testRoot)\input'
    Contents: '**'
    TargetFolder: '$(testRoot)\copied'
    CleanTargetFolder: true
    OverWrite: true

# 3. Node handler invoking the task-bundled 7-Zip executable.
- task: ArchiveFiles@2
  displayName: '3. ArchiveFiles V2 - bundled 7-Zip'
  inputs:
    rootFolderOrFile: '$(testRoot)\copied'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(testRoot)\wdac-test.zip'
    replaceExistingArchive: true
    verbose: true

# 4. Node handler exercising the extraction implementation.
- task: ExtractFiles@1
  displayName: '4. ExtractFiles V1 - archive extraction'
  inputs:
    archiveFilePatterns: '$(testRoot)\wdac-test.zip'
    destinationFolder: '$(testRoot)\extracted'
    cleanDestinationFolder: true
    overwriteExistingFiles: true

# 5. Active tool installer: download, extract and cache a .NET SDK.
- task: UseDotNet@2
  displayName: '5. UseDotNet V2 - install .NET SDK'
  inputs:
    packageType: sdk
    version: '8.0.100'
    installationPath: '$(Agent.ToolsDirectory)\dotnet'

# 6. Node handler invoking the installed dotnet executable.
- task: DotNetCoreCLI@2
  displayName: '6. DotNetCoreCLI V2 - execute dotnet'
  inputs:
    command: custom
    custom: '--info'
    workingDirectory: '$(testRoot)'

# 7. Deprecated Tasks-and-Agent-owned installer.
- task: NodeTool@0
  displayName: '7. NodeTool V0 - deprecated'
  inputs:
    versionSource: spec
    versionSpec: '18.20.8'
    checkLatest: false

# 8. Deprecated Tasks-and-Agent-owned .NET installer.
- task: DotNetCoreInstaller@0
  displayName: '8. DotNetCoreInstaller V0 - deprecated'
  inputs:
    packageType: sdk
    version: '2.1.505'

# 9. Node task uploading an artifact to Azure DevOps.
- task: PublishBuildArtifacts@1
  displayName: '9. PublishBuildArtifacts V1 - service upload'
  inputs:
    PathtoPublish: '$(testRoot)\wdac-test.zip'
    ArtifactName: wdac-drop
    ArtifactType: Container

# 10. Managed AgentPlugin task downloading the artifact.
- task: DownloadBuildArtifacts@1
  displayName: '10. DownloadBuildArtifacts V1 - AgentPlugin'
  inputs:
    buildType: current
    downloadType: single
    artifactName: wdac-drop
    downloadPath: '$(testRoot)\downloaded'
    cleanDestinationFolder: true
    checkDownloadedFiles: true
