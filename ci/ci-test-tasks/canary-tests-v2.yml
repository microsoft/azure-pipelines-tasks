parameters:
- name: includeLocalPackagesBuildConfig
  displayName: Flag to update LocalPackages buildconfig (for testing, this will be made  default later)
  type: boolean
  default: false # Note: keep in sync with /azure-pipelines.yml
- name: requiredNodeHandler
  displayName: Required Node handler for non-deprecated in-box tasks
  type: string
  default: Node24

variables:
- name: includeLocalPackagesBuildConfigParameter
  ${{ if eq(parameters.includeLocalPackagesBuildConfig, true) }}:
    value: '--includeLocalPackagesBuildConfig'
  ${{ else }}:
    value: ''
- name: IncludeLocalPackagesBuildConfigTest
  ${{ if eq(parameters.includeLocalPackagesBuildConfig, true) }}:
    value: '1'
  ${{ else }}:
    value: ''

trigger:
  - master
  - releases/*

jobs:
- job: detect_changes
  displayName: Detect changes
  pool:
    vmImage: ubuntu-22.04
  steps:
  - script: |
      git fetch origin master
      changedFiles=$(git diff --name-only origin/master)
      echo "$changedFiles"
      tasks=$(node ./ci/ci-test-tasks/detect-changed-tasks.js $changedFiles)
      echo "##vso[task.setvariable variable=CHANGED_TASKS]$tasks"
      echo "##vso[task.setvariable variable=TASKS;isoutput=true]$tasks"
    displayName: 'Detect changed tasks'
    name: detect

  - script: |
      node --test ./ci/ci-test-tasks/validate-node-handler.test.js
      node ./ci/ci-test-tasks/validate-node-handler.js "$REQUIRED_NODE_HANDLER" "$CHANGED_TASKS"
    displayName: 'Validate ${{ parameters.requiredNodeHandler }} handler'
    env:
      REQUIRED_NODE_HANDLER: ${{ parameters.requiredNodeHandler }}
      CHANGED_TASKS: $(CHANGED_TASKS)

- job: run_main_test_pipeline
  displayName: Run main test pipeline
  condition: |
    and(
      succeeded(),
      gt(length(dependencies.detect_changes.outputs['detect.TASKS']), 0)
    )
  dependsOn: detect_changes
  timeoutInMinutes: 360
  variables:
      - name: tasks
        value: $[dependencies.detect_changes.outputs['detect.TASKS']]
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: NodeTool@0
    displayName: Use Node 24.x
    inputs:
      versionSpec: 24.x

  - script: |
      cd ./ci/ci-test-tasks/test-and-verify-v2
      npm i
      npm run build
    displayName: 'Build test pipelines runner'

  - script: |
      echo "Tasks to test: $(tasks)"
      node --no-deprecation ./ci/ci-test-tasks/test-and-verify-v2 $(System.AccessToken) $(ADOUrl) $(System.TeamProject) $(tasks)
    displayName: 'Run test pipelines and verify results'
    failOnStderr: true