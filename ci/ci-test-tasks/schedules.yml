schedules:
- cron: "35 9 * * *"
  displayName: Daily
  branches:
    include:
    - master
  always: true

trigger: none
pr: none

jobs:
- job: set_tasks
  displayName: Set tasks to test
  pool:
    vmImage: ubuntu-latest
  steps:
  - bash: |
      npm i minimist
    displayName: npm i minimist
  - bash: |
      tasks=$(node ./ci/ci-test-tasks/get-tasks.js --exclude "$(TASKS_TO_EXCLUDE)")
      echo "##vso[task.setvariable variable=tasks;isoutput=true]${tasks}"
    displayName: Set tasks to test
    name: set

- job: run_main_test_pipeline
  displayName: Run main test pipeline
  dependsOn: set_tasks
  timeoutInMinutes: 360
  variables:
  - name: tasks
    value: $[dependencies.set_tasks.outputs['set.tasks']]
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: NodeTool@0
    displayName: Use Node 20.x
    inputs:
      versionSpec: 20.x

  - script: |
      cd ./ci/ci-test-tasks/test-and-verify-v2
      npm i
      npm run build
    displayName: 'Build test pipelines runner'

  - task: AzureCLI@3
    displayName: Run test pipelines and verify results
    inputs:
      connectionType: azureDevOps
      azureDevOpsServiceConnection: 'QueueBuild-SC'
      keepAzSessionActive: true
      scriptType: pscore
      scriptLocation: inlineScript
      failOnStandardError: true
      inlineScript: |
        $canaryToken = az account get-access-token `
          --resource 499b84ac-1321-427f-aa17-267ca6975798 `
          --query accessToken --output tsv --only-show-errors
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($canaryToken)) {
          throw 'Failed to obtain the canary build service connection token.'
        }
        $canaryToken = $canaryToken.Trim()
        Write-Host "##vso[task.setsecret]$canaryToken"
        $env:CANARY_BUILDS_ACCESS_TOKEN = $canaryToken
        Write-Host "Tasks to test: $env:CANARY_TASKS"
        node ./ci/ci-test-tasks/test-and-verify-v2 $env:CANARY_ADO_URL $env:CANARY_PROJECT $env:CANARY_TASKS
        exit $LASTEXITCODE
    env:
      CANARY_ADO_URL: $(ADOUrl)
      CANARY_PROJECT: $(System.TeamProject)
      CANARY_TASKS: $(tasks)
